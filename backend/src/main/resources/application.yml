spring:
  application:
    name: quality-control
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

sa-token:
  token-name: Authorization
  # 前端请求头为 Authorization: Bearer {token}，须配置前缀否则整段被当作 token 导致 401
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-header: true

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.jhict.quality.controller

app:
  upload:
    base-path: /opt/quality-control/uploads
    url-prefix: /api/v1/files
    max-size: 20971520
  cert:
    # 质保书纳入的指标类别（D-017）：默认成分/性能/尺寸；ADMIN 可修改此配置项
    included-categories: COMPOSITION,PERFORMANCE,DIMENSION
  concession:
    # 让步催促提醒阈值（天数，FR-009）：confirm_status=PENDING 超过此天数自动提醒
    remind-days: 7
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-ms: 5000
    max-retries-on-429: 1
    circuit-breaker-threshold: 3
    circuit-breaker-open-ms: 60000
    mock-failure: ${AI_MOCK_FAILURE:}

logging:
  level:
    com.jhict.quality: DEBUG
    com.baomidou.mybatisplus: WARN
