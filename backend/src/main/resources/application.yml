spring:
  application:
    name: quality-control
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

sa-token:
  token-name: Authorization
  # 前端请求头为 Authorization: Bearer {token}，须配置前缀否则整段被当作 token 导致 401
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-header: true

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.jhict.quality.controller

app:
  upload:
    base-path: /opt/quality-control/uploads
    url-prefix: /api/v1/files
    max-size: 20971520
  cert:
    # 质保书纳入的指标类别（D-017）：默认成分/性能/尺寸；ADMIN 可修改此配置项
    included-categories: COMPOSITION,PERFORMANCE,DIMENSION
  concession:
    # 让步催促提醒阈值（天数，FR-009）：confirm_status=PENDING 超过此天数自动提醒
    remind-days: 7
  ai:
    model:
      enabled: ${DEEPSEEK_ENABLED:false}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${DEEPSEEK_API_KEY:}
      chat-model: ${DEEPSEEK_MODEL:deepseek-chat}
      embedding-model: ${DEEPSEEK_EMBEDDING_MODEL:text-embedding-v1}
      timeout-millis: ${DEEPSEEK_TIMEOUT_MILLIS:15000}
    vector:
      enabled: ${ES_VECTOR_ENABLED:false}
      host: ${ES_HOST:http://localhost:9200}
      username: ${ES_USERNAME:}
      password: ${ES_PASSWORD:}
      standard-index: ${ES_STANDARD_INDEX:quality-standard-clauses}
      timeout-millis: ${ES_TIMEOUT_MILLIS:5000}

logging:
  level:
    com.jhict.quality: DEBUG
    com.baomidou.mybatisplus: WARN
