spring:
  application:
    name: quality-control
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8080
  servlet:
    context-path: /

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

sa-token:
  token-name: Authorization
  # 前端请求头为 Authorization: Bearer {token}，须配置前缀否则整段被当作 token 导致 401
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-header: true

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.jhict.quality.controller

app:
  upload:
    base-path: /opt/quality-control/uploads
    url-prefix: /api/v1/files
    max-size: 20971520
  standard-document:
    storage-path: ${STANDARD_DOC_STORAGE_PATH:resources/standard-documents}
    max-file-size-mb: ${STANDARD_DOC_MAX_MB:50}
    allowed-extensions: ${STANDARD_DOC_ALLOWED_EXTENSIONS:pdf,xlsx,xls,png,jpg,jpeg}
    max-files-per-standard: ${STANDARD_DOC_MAX_FILES_PER_STANDARD:10}
  cert:
    # 质保书纳入的指标类别（D-017）：默认成分/性能/尺寸；ADMIN 可修改此配置项
    included-categories: COMPOSITION,PERFORMANCE,DIMENSION
  concession:
    # 让步催促提醒阈值（天数，FR-009）：confirm_status=PENDING 超过此天数自动提醒
    remind-days: 7
  ai:
    # 模型/向量配置统一在此维护；dev 环境通过 profile 覆盖开关与本地密钥默认值，勿在 application-dev.yml 重复
    model:
      provider: ${AI_MODEL_PROVIDER:SILICONFLOW}
      enabled: ${AI_MODEL_ENABLED:true}
      base-url: ${AI_MODEL_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${AI_MODEL_API_KEY:sk-kfedpjxaawzkfdwiqseddiwiydyyrycbyfacsqfjsyqlfntl}
      # RAG/解释推荐 V4-Flash；V3.2 在硅基流动上延迟高，本地 RAG 易超时
      chat-model: ${AI_MODEL_CHAT_MODEL:deepseek-ai/DeepSeek-V4-Flash}
      thinking-enabled: ${AI_MODEL_THINKING_ENABLED:false}
      reasoning-effort: ${AI_MODEL_REASONING_EFFORT:high}
      timeout-millis: ${AI_MODEL_TIMEOUT_MILLIS:60000}
      vision:
        enabled: ${AI_VISION_ENABLED:true}
        model: ${AI_VISION_MODEL:deepseek-ai/DeepSeek-OCR}
        ocr-prompt: ${AI_VISION_OCR_PROMPT:<image>\n<|grounding|>Convert the document to markdown.}
        image-detail: ${AI_VISION_IMAGE_DETAIL:high}
        timeout-millis: ${AI_VISION_TIMEOUT_MILLIS:60000}
    embedding:
      enabled: ${EMBEDDING_ENABLED:true}
      base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${EMBEDDING_API_KEY:sk-vbbwrwhjxaqekhnketstevzmrxbutsctwvyzqospojwoevtg}
      model: ${EMBEDDING_MODEL:BAAI/bge-m3}
      provider: ${EMBEDDING_PROVIDER:SILICONFLOW}
      timeout-millis: ${EMBEDDING_TIMEOUT_MILLIS:15000}
    vector:
      enabled: ${ES_VECTOR_ENABLED:true}
      host: ${ES_HOST:http://localhost:9200}
      username: ${ES_USERNAME:elastic}
      password: ${ES_PASSWORD:sisHuNo.1}
      standard-index: ${ES_STANDARD_INDEX:quality-standard-clauses}
      timeout-millis: ${ES_TIMEOUT_MILLIS:5000}

logging:
  level:
    com.jhict.quality: DEBUG
    com.baomidou.mybatisplus: WARN
