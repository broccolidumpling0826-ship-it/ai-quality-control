spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/ai_quality_control?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&tinyInt1isBit=false
    username: ${DB_USER:ai_quality_control}
    password: ${DB_PASSWORD:sisHuNo.1}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

  redis:
    host: 127.0.0.1
    port: 6380
    password: ${REDIS_PASSWORD:sisHuNo.1}
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 1
        max-wait: -1ms

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  upload:
    base-path: /tmp/quality-control/uploads
  standard:
    # 临时关闭生效区间重叠校验，便于构造标准冲突测试数据；测完请改回 true
    enforce-effective-window-overlap: false
