spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/ai_quality_control?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&tinyInt1isBit=false
    username: ${DB_USER:ai_quality_control}
    password: ${DB_PASSWORD:sisHuNo.1}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

  redis:
    host: 127.0.0.1
    port: 6380
    password: ${REDIS_PASSWORD:sisHuNo.1}
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 1
        max-wait: -1ms

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  upload:
    base-path: /tmp/quality-control/uploads
  ai:
    model:
      provider: ${AI_MODEL_PROVIDER:SILICONFLOW}
      enabled: ${AI_MODEL_ENABLED:false}
      base-url: ${AI_MODEL_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${AI_MODEL_API_KEY:}
      chat-model: ${AI_MODEL_CHAT_MODEL:Pro/zai-org/GLM-4.7}
      thinking-enabled: ${AI_MODEL_THINKING_ENABLED:false}
      reasoning-effort: ${AI_MODEL_REASONING_EFFORT:high}
      timeout-millis: ${AI_MODEL_TIMEOUT_MILLIS:15000}
    embedding:
      enabled: ${EMBEDDING_ENABLED:false}
      base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${EMBEDDING_API_KEY:}
      model: ${EMBEDDING_MODEL:BAAI/bge-m3}
      provider: ${EMBEDDING_PROVIDER:SILICONFLOW}
      timeout-millis: ${EMBEDDING_TIMEOUT_MILLIS:15000}
    vector:
      enabled: ${ES_VECTOR_ENABLED:false}
      host: ${ES_HOST:http://localhost:9200}
      username: ${ES_USERNAME:elastic}
      password: ${ES_PASSWORD:sisHuNo.1}
      standard-index: ${ES_STANDARD_INDEX:quality-standard-clauses}
      timeout-millis: ${ES_TIMEOUT_MILLIS:5000}
